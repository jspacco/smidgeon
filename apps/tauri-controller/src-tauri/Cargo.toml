[package]
name = "crs-controller"
version = "0.0.1"
edition = "2021"

[lib]
name = "crs_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-oauth = "2"
tauri-plugin-log = "2"
log = "^0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scap = "0.1.0-beta.1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
