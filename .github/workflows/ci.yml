name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version specified here — uses packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (types first via turbo)
        run: pnpm build --filter=@crs/types --filter=@crs/ui

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Build web apps
        run: pnpm build --filter=@crs/student-pwa --filter=@crs/faculty-pwa --filter=@crs/faculty-dashboard

  accessibility:
    name: Accessibility (axe-core)
    # NOTE: This check covers the student-pwa login screen only.
    # It does not check authenticated views (voting UI, question views, results).
    # Useful as a baseline sanity check but not a complete accessibility audit.
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter=@crs/types --filter=@crs/ui

      - name: Build student-pwa
        run: pnpm build --filter=@crs/student-pwa

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start student-pwa preview server
        run: pnpm --filter=@crs/student-pwa exec vite preview --port 4173 &

      - name: Wait for preview server
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run axe-core accessibility check
        run: node scripts/axe-check.mjs http://localhost:4173