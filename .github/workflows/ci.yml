name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck-and-build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version specified here — uses packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (types first via turbo)
        run: pnpm build --filter=@crs/types --filter=@crs/ui

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Build web apps
        run: pnpm build --filter=@crs/student-pwa --filter=@crs/faculty-pwa --filter=@crs/faculty-dashboard
